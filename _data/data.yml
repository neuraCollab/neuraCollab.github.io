projects:
  title: Проекты
  assignments:
  - title: LLM KV-Cache Quantization
    link: "https://github.com/neuraCollab/kv-cache-quantization-reasoning-study"
    tagline: "Исследовал FP8 и HQQ INT4/INT2 на 3 reasoning-моделях и 80 задачах AIME-24/MATH-500. Разработал анализ First Divergence Point, K-error, Attention-KL и Logit-KL для поиска причин деградации reasoning. Показал зависимость качества от архитектуры модели и локализацию ошибок квантования в outlier-каналах; исследовал сохранение критических каналов как способ снижения деградации."
    tags: [FP8, HQQ, KV-cache, Quantization, LLM, GPU, Reasoning]

  - title: AutoTopic — Topic Modeling
    link: "https://github.com/neuraCollab/ml-portfolio/tree/main/AutoTopic"
    tagline: "Построил pipeline BERTopic: multilingual SentenceTransformers → UMAP → HDBSCAN → c-TF-IDF; для русского использовал pymorphy3, для английского — spaCy. Провёл сравнение с LDA и автоматический подбор гиперпараметров через Optuna по coherence и diversity. На полном датасете обнаружил 59 тем из 236K проанализированных документов; diversity BERTopic — 0.966 против ~0.91 у LDA."
    tags: [NLP, BERTopic, SentenceTransformers, UMAP, HDBSCAN, LDA, Optuna]

  - title: Distributed ML Inference
    link: "https://github.com/neuraCollab/ml-portfolio/tree/main/cassandra-grpc-ml"
    tagline: "Реализовал TF-IDF + One-vs-Rest Logistic Regression для классификации 50 тем на данных AutoTopic. Построил архитектуру FastAPI → Coordinator → gRPC workers с Kubernetes, Cassandra для состояния и MinIO для ML-артефактов. Масштабирование с 1 до 5 worker-реплик увеличило throughput с 87.1 до 346.2 req/s, снизив p50 latency с 684 до 165 мс."
    tags: [ML Inference, FastAPI, gRPC, Kubernetes, Cassandra, MinIO, scikit-learn]
    note: "Демонстрационная / исследовательская архитектура, не production-система."

  - title: ECG Edge AI
    link: "https://github.com/neuraCollab/ml-portfolio/tree/main/raspberry-pi-ecg"
    tagline: "Собрал систему сбора данных: 2× AD8232 + 2× Arduino Nano → Raspberry Pi 5; реализовал восстановление 6 отведений и фильтрацию сигнала. Интегрировал готовую PyTorch-модель ЭКГ и подготовил её для CPU-only inference через TorchScript. Реализовал FastAPI/WebSocket inference pipeline и signal-quality gate; получил 5.18 мс на предсказание на Raspberry Pi 5."
    tags: [PyTorch, TorchScript, Raspberry Pi 5, Edge AI, Signal Processing, FastAPI]
    note: "Исследовательский / образовательный прототип, не является медицинским устройством."

