projects:
  title: Проекты
  assignments:
  - title: LLM KV-Cache Quantization
    link: "https://github.com/neuraCollab/ml-portfolio/tree/main/kv-cache-quantization-reasoning-study"
    tagline: "Исследовал деградацию reasoning при квантовании KV-cache LLM: FP8 и HQQ INT4/INT2 на 3 моделях, 80 задачах AIME-24/MATH-500. Ввёл метрики диагностики (First Divergence Point, K-error, Attention-KL, Logit-KL) и показал локализацию деградации в outlier-каналах. Стек: Python, PyTorch, GPU."

  - title: AutoTopic — Topic Modeling
    link: "https://github.com/neuraCollab/ml-portfolio/tree/main/AutoTopic"
    tagline: "Pipeline тематического моделирования (BERTopic: SentenceTransformers → UMAP → HDBSCAN → c-TF-IDF; pymorphy3/spaCy) с автоподбором гиперпараметров через Optuna. На 236K документов нашёл 59 тем; diversity 0.966 против ~0.91 у LDA. Стек: Python, BERTopic, SentenceTransformers, Optuna."

  - title: Distributed ML Inference
    link: "https://github.com/neuraCollab/ml-portfolio/tree/main/cassandra-grpc-ml"
    tagline: "TF-IDF + One-vs-Rest LogisticRegression для классификации 50 тем; инференс через FastAPI → Coordinator → gRPC-воркеры на Kubernetes (состояние в Cassandra, артефакты в MinIO). Масштабирование 1→5 воркеров: throughput 87.1→346.2 req/s, p50 latency 684→165 мс. Стек: Python, FastAPI, Kubernetes, gRPC, Cassandra, MinIO."

  - title: ECG Edge AI
    link: "https://github.com/neuraCollab/ml-portfolio/tree/main/raspberry-pi-ecg"
    tagline: "Система сбора ЭКГ-данных на 2×AD8232 + 2×Arduino Nano → Raspberry Pi 5 с восстановлением 6 отведений и фильтрацией сигнала. Интегрировал готовую PyTorch-модель ЭКГ (TorchScript, CPU-only inference), реализовал FastAPI/WebSocket пайплайн с signal-quality gate — 5.18 мс на предсказание. Стек: Python, PyTorch, TorchScript, FastAPI, Raspberry Pi."

